<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOBA VERSE · Mini Audio Mastering Lab</title>
    <meta
      name="description"
      content="Browser-based automatic audio post-production, Voice Clean, and mastering laboratory using the Web Audio API for analysis, DSP processing, matched-loudness A/B comparison, and 16-bit WAV export."
    />
    <meta property="og:title" content="LOBA VERSE · Mini Audio Mastering Lab" />
    <meta
      property="og:description"
      content="Browser-based automatic audio post-production, Voice Clean, and mastering laboratory using the Web Audio API for analysis, DSP processing, matched-loudness A/B comparison, and 16-bit WAV export."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('maml-theme');
          // Match Lobaverse / Quotly default dark obsidian theme unless user explicitly chose light
          var isDark = saved ? saved === 'dark' : true;
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased selection:bg-[var(--accent-muted)] selection:text-[var(--accent)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
